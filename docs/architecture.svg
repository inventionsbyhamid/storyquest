<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 830" width="1400" height="830" role="img" aria-labelledby="title desc">
  <title id="title">StoryQuest system design</title>
  <desc id="desc">Fire TV, Android TV and browser clients reach the StoryQuest API server through Cloudflare. The server keeps stories in SQLite and media files on one Docker volume, asks a language model to write each chapter, films it as AI video on fal, and can check purchases and content with Amazon services.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #3E4C59; font-size: 12px; }
      .title { font-size: 24px; font-weight: 700; fill: #1F2933; }
      .sub { font-size: 14px; fill: #616E7C; }
      .col { font-size: 12.5px; font-weight: 600; fill: #7B8794; }
      .box { font-size: 15px; font-weight: 600; }
      .mod { font-size: 13.5px; font-weight: 600; fill: #1F2933; }
      .em { font-size: 12.5px; font-weight: 600; fill: #323F4B; }
      .opt { font-size: 12.5px; fill: #3E4C59; }
      .note { font-size: 11.5px; fill: #7B8794; }
      .lab { font-size: 11px; fill: #7B8794; }
      .num { font-size: 12px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
      .step { font-size: 12.5px; fill: #3E4C59; }
      .solid { fill: none; stroke: #4A5563; stroke-width: 1.6; marker-end: url(#a); }
      .dash { fill: none; stroke: #8A94A3; stroke-width: 1.6; stroke-dasharray: 6 5; marker-end: url(#b); }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#4A5563"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A94A3"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1398" height="828" rx="18" fill="#FFFFFF" stroke="#DCE1E7" stroke-width="1.5"/>

  <text class="title" x="40" y="58">StoryQuest system design</text>
  <text class="sub" x="40" y="82">Each chapter is written by a language model and filmed as AI video, one family choice at a time</text>

  <!-- Legend -->
  <rect x="816" y="38" width="544" height="36" rx="8" fill="none" stroke="#E4E7EB"/>
  <path class="solid" d="M830 56 H868"/>
  <text x="878" y="60">Runtime call</text>
  <path class="dash" d="M980 56 H1018"/>
  <text x="1028" y="60">Switchable or optional</text>
  <circle cx="1196" cy="56" r="10" fill="#1C2240"/>
  <text class="num" x="1196" y="60">1</text>
  <text x="1214" y="60">New chapter, in order</text>

  <!-- Column labels -->
  <text class="col" x="40" y="118">Clients</text>
  <text class="col" x="310" y="118">Edge</text>
  <text class="col" x="500" y="118">Server and data</text>
  <text class="col" x="1020" y="118">External services</text>

  <!-- Clients -->
  <rect x="40" y="132" width="230" height="114" rx="10" fill="#EEF3FA" stroke="#A7BEDB" stroke-width="1.3"/>
  <text class="box" x="56" y="158" fill="#24456E">Fire TV, Vega OS</text>
  <text x="56" y="180">React Native for Vega</text>
  <text x="56" y="197">W3C media player</text>
  <text x="56" y="214">Amazon IAP buys Sparks</text>
  <text x="56" y="231">Voice ideas by remote mic</text>

  <rect x="40" y="266" width="230" height="84" rx="10" fill="#EEF3FA" stroke="#A7BEDB" stroke-width="1.3"/>
  <text class="box" x="56" y="292" fill="#24456E">Android TV and Fire OS</text>
  <text x="56" y="314">React Native tvOS with Expo</text>
  <text x="56" y="331">Same screens as Fire TV</text>

  <rect x="40" y="370" width="230" height="84" rx="10" fill="#EEF3FA" stroke="#A7BEDB" stroke-width="1.3"/>
  <text class="box" x="56" y="396" fill="#24456E">Browser</text>
  <text x="56" y="418">Web player at /play, to watch</text>
  <text x="56" y="435">Share page opened by QR code</text>

  <text class="note" x="40" y="478">One shared codebase of screens</text>
  <text class="note" x="40" y="494">and story logic runs all three</text>

  <!-- Edge -->
  <rect x="310" y="132" width="160" height="348" rx="10" fill="#FBF4E8" stroke="#E0BF8A" stroke-width="1.3"/>
  <text class="box" x="324" y="158" fill="#7A4E12">Cloudflare</text>
  <text class="note" x="324" y="178" fill="#7A4E12">storyquest.dijmo.com</text>
  <text x="324" y="214">HTTPS</text>
  <text x="324" y="238">Caches clips and</text>
  <text x="324" y="254">posters at the edge</text>
  <text x="324" y="278">Real visitor IP</text>
  <text x="324" y="294">for rate limits</text>

  <!-- Server -->
  <rect x="500" y="132" width="440" height="348" rx="10" fill="#EEF6F1" stroke="#A3CBB2" stroke-width="1.3"/>
  <text class="box" x="518" y="158" fill="#22573A">StoryQuest API server</text>
  <text x="922" y="158" text-anchor="end" fill="#4F6F5C">Node 22, Fastify, Docker</text>

  <g fill="#FFFFFF" stroke="#BFDCCB" stroke-width="1.2">
    <rect x="518" y="178" width="194" height="62" rx="8"/>
    <rect x="518" y="252" width="194" height="62" rx="8"/>
    <rect x="518" y="326" width="194" height="62" rx="8"/>
    <rect x="518" y="400" width="194" height="62" rx="8"/>
    <rect x="728" y="178" width="194" height="62" rx="8"/>
    <rect x="728" y="252" width="194" height="62" rx="8"/>
    <rect x="728" y="326" width="194" height="62" rx="8"/>
    <rect x="728" y="400" width="194" height="62" rx="8"/>
  </g>

  <text class="mod" x="530" y="200">HTTP API</text>
  <text x="530" y="218">JSON API, site, share pages</text>
  <text x="530" y="233">Rate limits per visitor IP</text>

  <text class="mod" x="530" y="274">Story engine</text>
  <text x="530" y="292">Story trees, shared paths</text>
  <text x="530" y="307">Private branch per idea</text>

  <text class="mod" x="530" y="348">Media with ffmpeg</text>
  <text x="530" y="366">Clip, poster, last frame</text>
  <text x="530" y="381">Stitches the whole movie</text>

  <text class="mod" x="530" y="422">Budget caps</text>
  <text x="530" y="440">Daily, total and hard caps</text>
  <text x="530" y="455">Counters survive restarts</text>

  <text class="mod" x="740" y="200">Director</text>
  <text x="740" y="218">Plans each story first</text>
  <text x="740" y="233">Three shots, two choices</text>

  <text class="mod" x="740" y="274">Filming queue</text>
  <text x="740" y="292">Next shot films during play</text>
  <text x="740" y="307">Pauses if fal credit is low</text>

  <text class="mod" x="740" y="348">Safety</text>
  <text x="740" y="366">Word list on ideas, scripts</text>
  <text x="740" y="381">One report hides a scene</text>

  <text class="mod" x="740" y="422">Wallet and Sparks</text>
  <text x="740" y="440">Sparks for private chapters</text>
  <text x="740" y="455">Checks Amazon receipts</text>

  <!-- Data -->
  <rect x="500" y="504" width="210" height="146" rx="10" fill="#F3F0F9" stroke="#BCB1DA" stroke-width="1.3"/>
  <text class="box" x="516" y="530" fill="#4B3D78">Media files</text>
  <text x="516" y="552">Clips, posters, last frames,</text>
  <text x="516" y="568">stitched story movies</text>
  <text x="516" y="592">Docker volume at /data</text>
  <text x="516" y="616">Served at /media and</text>
  <text x="516" y="632">cached for a year</text>

  <rect x="730" y="504" width="210" height="146" rx="10" fill="#F3F0F9" stroke="#BCB1DA" stroke-width="1.3"/>
  <text class="box" x="746" y="530" fill="#4B3D78">SQLite</text>
  <text x="746" y="552">Stories, chapters, ideas,</text>
  <text x="746" y="568">wallets, purchases, reports</text>
  <text x="746" y="584">and spend counters</text>
  <text x="746" y="608">One file on the same volume</text>
  <text x="746" y="624">WAL mode</text>

  <!-- External: story director -->
  <rect x="1020" y="132" width="340" height="186" rx="10" fill="#F4F5F7" stroke="#BCC3CE" stroke-width="1.3"/>
  <text class="box" x="1036" y="158" fill="#2D3A4A">Story director (LLM)</text>
  <rect x="1036" y="170" width="308" height="44" rx="6" fill="#FFFFFF" stroke="#8E9AAB" stroke-width="1.2"/>
  <text class="em" x="1048" y="188">Amazon Bedrock: Claude</text>
  <text class="lab" x="1332" y="188" text-anchor="end" fill="#22573A">in use</text>
  <text class="note" x="1048" y="205">Plans each story and writes every chapter</text>
  <rect x="1036" y="224" width="308" height="80" rx="6" fill="#FFFFFF" stroke="#9AA5B4" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text class="lab" x="1048" y="241">Switchable with one setting</text>
  <text class="opt" x="1048" y="259">OpenRouter: DeepSeek V4.1 Flash</text>
  <text class="opt" x="1048" y="276">Anthropic API: Claude</text>
  <text class="opt" x="1048" y="293">Any OpenAI compatible API</text>

  <!-- External: video -->
  <rect x="1020" y="334" width="340" height="156" rx="10" fill="#F4F5F7" stroke="#BCC3CE" stroke-width="1.3"/>
  <text class="box" x="1036" y="360" fill="#2D3A4A">AI video on fal</text>
  <text class="em" x="1036" y="382">MiniMax H3 Max Turbo</text>
  <text x="1036" y="400">Text to video for the opening shot</text>
  <text x="1036" y="417">Image to video from the last frame</text>
  <text x="1036" y="434">Its own safety checker is on</text>
  <rect x="1036" y="446" width="308" height="30" rx="6" fill="#FFFFFF" stroke="#9AA5B4" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="1048" y="465">Billing API: balance check, optional</text>

  <!-- External: Amazon -->
  <rect x="1020" y="506" width="340" height="144" rx="10" fill="#F4F5F7" stroke="#BCC3CE" stroke-width="1.3"/>
  <text class="box" x="1036" y="532" fill="#2D3A4A">Amazon services</text>
  <rect x="1036" y="544" width="308" height="42" rx="6" fill="#FFFFFF" stroke="#9AA5B4" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text class="em" x="1048" y="561">Bedrock Guardrails</text>
  <text class="note" x="1048" y="578">Second safety check, SAFETY=guardrails</text>
  <rect x="1036" y="594" width="308" height="42" rx="6" fill="#FFFFFF" stroke="#9AA5B4" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text class="em" x="1048" y="611">Receipt Verification Service</text>
  <text class="note" x="1048" y="628">IAP_MODE sandbox or production</text>

  <!-- Clients to Cloudflare to server -->
  <path class="solid" d="M270 189 H310"/>
  <path class="solid" d="M270 308 H310"/>
  <path class="solid" d="M270 412 H310"/>
  <path class="solid" d="M470 209 H518"/>

  <!-- Server to data -->
  <path class="solid" d="M605 480 V504"/>
  <text class="lab" x="613" y="496">files</text>
  <path class="solid" d="M835 480 V504"/>
  <text class="lab" x="843" y="496">rows</text>

  <!-- Media back to the TVs -->
  <path class="solid" d="M500 610 H390 V480"/>
  <text class="lab" x="402" y="628">clips stream out</text>

  <!-- Server to external services -->
  <path class="solid" d="M922 192 H1036"/>
  <path class="dash" d="M922 232 H1036"/>
  <path class="solid" d="M922 296 H1000 V392 H1020"/>
  <path class="dash" d="M922 352 H980 V565 H1036"/>
  <path class="dash" d="M922 436 H960 V615 H1036"/>

  <!-- Steps for one new chapter -->
  <g>
    <circle cx="289" cy="189" r="10" fill="#1C2240"/>
    <text class="num" x="289" y="193">1</text>
    <circle cx="980" cy="192" r="10" fill="#1C2240"/>
    <text class="num" x="980" y="196">2</text>
    <circle cx="904" cy="344" r="10" fill="#1C2240"/>
    <text class="num" x="904" y="348">3</text>
    <circle cx="1000" cy="344" r="10" fill="#1C2240"/>
    <text class="num" x="1000" y="348">4</text>
    <circle cx="699" cy="344" r="10" fill="#1C2240"/>
    <text class="num" x="699" y="348">5</text>
    <circle cx="390" cy="545" r="10" fill="#1C2240"/>
    <text class="num" x="390" y="549">6</text>
  </g>

  <path d="M40 676 H1360" stroke="#E4E7EB" stroke-width="1.2"/>
  <text class="mod" x="40" y="704">When a family picks a path nobody filmed yet</text>

  <g>
    <circle cx="51" cy="738" r="10" fill="#1C2240"/>
    <text class="num" x="51" y="742">1</text>
    <text class="step" x="70" y="735">The family picks a path or</text>
    <text class="step" x="70" y="752">says an idea, checked first</text>

    <circle cx="273" cy="738" r="10" fill="#1C2240"/>
    <text class="num" x="273" y="742">2</text>
    <text class="step" x="292" y="735">The director writes three</text>
    <text class="step" x="292" y="752">shots and two new choices</text>

    <circle cx="495" cy="738" r="10" fill="#1C2240"/>
    <text class="num" x="495" y="742">3</text>
    <text class="step" x="514" y="735">Safety checks the script</text>
    <text class="step" x="514" y="752">before anything is filmed</text>

    <circle cx="717" cy="738" r="10" fill="#1C2240"/>
    <text class="num" x="717" y="742">4</text>
    <text class="step" x="736" y="735">fal films each shot from</text>
    <text class="step" x="736" y="752">the last frame before it</text>

    <circle cx="939" cy="738" r="10" fill="#1C2240"/>
    <text class="num" x="939" y="742">5</text>
    <text class="step" x="958" y="735">ffmpeg saves the clip and</text>
    <text class="step" x="958" y="752">poster, SQLite records it</text>

    <circle cx="1161" cy="738" r="10" fill="#1C2240"/>
    <text class="num" x="1161" y="742">6</text>
    <text class="step" x="1180" y="735">The TV plays the clip</text>
    <text class="step" x="1180" y="752">through Cloudflare</text>
  </g>

  <text class="note" x="40" y="800">A path filmed once replays instantly for every family. With no keys set, a stand in writer and placeholder clips run offline.</text>
</svg>

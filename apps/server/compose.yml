# Self hosting: cp .env.example .env, fill in keys, then run `docker compose up -d --build` in this folder.
services:
  storyquest:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    image: storyquest-server:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      HOST: 0.0.0.0
      PORT: "8080"
    ports:
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - storyquest-data:/data
    stop_grace_period: 30s

volumes:
  storyquest-data:
